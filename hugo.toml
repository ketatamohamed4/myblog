baseURL = "https://mketata.vercel.app/"
languageCode = "en-us"
title = "Mohamed Ketata"
theme = "PaperMod"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  description = "Mohamed Ketata: cloud, DevOps and embedded projects, with a focus on troubleshooting."

  [params.homeInfoParams]
    Title = "Hi, I'm Mohamed Ketata"
    Content = """
IT student in Tunisia learning cloud infrastructure and DevOps by building real projects. I worked on open-source VDI at Safozi, and I'm now working through the LearnToCloud guide.

This blog documents what I build, what breaks, and how I fix it. Start with the [About page](/about/) or browse the [posts](/posts/).
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ketatamo4"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/mohamed-ketata-831244395"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
